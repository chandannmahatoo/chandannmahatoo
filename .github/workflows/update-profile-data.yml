name: Update profile data

on:
  schedule:
    - cron: "23 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared with the snake workflow so both workflows do not write concurrently.
concurrency:
  group: profile-readme-writes-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Ensure the default branch is checked out
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git switch -C "$BRANCH_NAME"

      - name: Generate dynamic README sections
        uses: actions/github-script@v8.0.0
        with:
          script: |
            const fs = require("fs");
            const path = "README.md";
            const readme = fs.readFileSync(path, "utf8");
            let updated = readme;

            function replaceMarkedBlock(source, startMarker, endMarker, content, label) {
              const startCount = source.split(startMarker).length - 1;
              const endCount = source.split(endMarker).length - 1;

              if (startCount !== 1 || endCount !== 1) {
                core.warning(`${label}: expected exactly one start and end marker; skipping this block.`);
                return source;
              }

              const startIndex = source.indexOf(startMarker);
              const endIndex = source.indexOf(endMarker);

              if (endIndex < startIndex) {
                core.warning(`${label}: markers are incorrectly ordered; skipping this block.`);
                return source;
              }

              return source.slice(0, startIndex + startMarker.length)
                + "\n" + content + "\n"
                + source.slice(endIndex);
            }

            // HELPERS-START
            // Shortens at a word boundary so text never ends mid-word.
            function cleanText(value, maxLength = 180) {
              const text = String(value || "")
                .replace(/[\r\n\t]+/g, " ")
                .replace(/\s+/g, " ")
                .trim();

              if (text.length <= maxLength) return text;

              const cut = text.slice(0, maxLength - 1);
              const space = cut.lastIndexOf(" ");
              return (space > maxLength * 0.6 ? cut.slice(0, space) : cut).trimEnd() + "…";
            }

            // Optional length argument; also escapes * < > so text cannot break the layout.
            function escapeMarkdown(value, maxLength = 180) {
              return cleanText(value, maxLength)
                .replace(/\\/g, "\\\\")
                .replace(/\|/g, "\\|")
                .replace(/`/g, "\\`")
                .replace(/\*/g, "\\*")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\[/g, "\\[")
                .replace(/\]/g, "\\]");
            }

            // Commit messages that are only a list of file paths become a readable line.
            function tidyCommitMessage(raw) {
              const first = String(raw || "").split("\n")[0].trim();
              if (!first) return "Commit message unavailable";

              const head = first.split(":")[0];
              const looksLikePaths = (first.match(/\//g) || []).length >= 2 && !/\s/.test(head);

              if (looksLikePaths) {
                const top = first.split(/[,:\s]/)[0].split("/")[0];
                return `Updated files in ${top}/`;
              }
              return first;
            }

            // NEW: whole days since a date.
            function daysSince(dateValue) {
              return Math.floor((Date.now() - new Date(dateValue).getTime()) / 86400000);
            }

            // NEW: human-friendly relative time ("yesterday", "3 days ago", "2 months ago").
            function relativeTime(dateValue) {
              const days = daysSince(dateValue);
              if (days < 1) return "today";
              if (days === 1) return "yesterday";
              if (days < 14) return `${days} days ago`;
              if (days < 60) return `${Math.floor(days / 7)} weeks ago`;
              if (days < 365) return `${Math.floor(days / 30)} months ago`;
              const years = Math.floor(days / 365);
              return years === 1 ? "1 year ago" : `${years} years ago`;
            }

            // NEW: freshness indicator from the last push date.
            function freshnessDot(dateValue) {
              const days = daysSince(dateValue);
              if (days <= 14) return "🟢";
              if (days <= 60) return "🟡";
              return "⚪";
            }

            // Language badge palette used in the generated repository cards.
            const LANGUAGE_STYLES = {
              "Python": ["3776AB", "python", "white"],
              "TypeScript": ["3178C6", "typescript", "white"],
              "JavaScript": ["F7DF1E", "javascript", "black"],
              "C++": ["00599C", "cplusplus", "white"],
              "C": ["A8B9CC", "c", "black"],
              "Jupyter Notebook": ["F37626", "jupyter", "white"],
              "HTML": ["E34F26", "html5", "white"],
              "CSS": ["1572B6", null, "white"],
              "Shell": ["4EAA25", "gnubash", "white"]
            };

            function escapeHTML(value) {
              return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\"/g, "&quot;")
                .replace(/'/g, "&#39;");
            }

            function languageBadge(language) {
              if (!language) return "<sub>Language not specified</sub>";
              const [color, logo, logoColor] = LANGUAGE_STYLES[language] || ["6E7681", null, "white"];
              const label = encodeURIComponent(language).replace(/-/g, "--").replace(/_/g, "__");
              const logoPart = logo ? `&logo=${logo}&logoColor=${logoColor}` : "";
              const src = `https://img.shields.io/badge/${label}-${color}?style=flat-square${logoPart}`;
              return `<img src="${src}" alt="${escapeHTML(language)}">`;
            }
            // HELPERS-END

            const owner = context.repo.owner;
            const repoName = context.repo.repo;

            // Fetch public repositories. API errors are warnings; no README content is lost.
            let repos = [];
            let reposAvailable = false;

            try {
              repos = await github.paginate(github.rest.repos.listForUser, {
                username: owner,
                type: "owner",
                sort: "pushed",
                direction: "desc",
                per_page: 100
              });

              // CHANGED: hides the profile repository itself and sorts by last push.
              repos = repos
                .filter(repo =>
                  !repo.fork &&
                  !repo.archived &&
                  !repo.private &&
                  repo.name.toLowerCase() !== owner.toLowerCase()
                )
                .sort((a, b) =>
                  new Date(b.pushed_at || b.updated_at) - new Date(a.pushed_at || a.updated_at)
                );

              reposAvailable = true;
            } catch (error) {
              core.warning(`Could not retrieve repositories (possible API/rate-limit issue): ${error.message}`);
            }

            // 1) Generate responsive, two-column repository cards.
            if (reposAvailable) {
              const latest = repos.slice(0, 6);

              function repositoryCard(repo) {
                const name = escapeHTML(repo.name);
                const url = escapeHTML(repo.html_url);
                const description = repo.description && repo.description.trim()
                  ? escapeHTML(cleanText(repo.description, 150))
                  : "An independent project and engineering workspace.";
                const language = languageBadge(repo.language);
                const pushedAt = repo.pushed_at || repo.updated_at;
                const updatedLabel = relativeTime(pushedAt);
                const freshness = freshnessDot(pushedAt);
                const stars = repo.stargazers_count > 0
                  ? ` &nbsp;⭐ ${repo.stargazers_count}`
                  : "";
                const topics = (repo.topics || [])
                  .slice(0, 3)
                  .map(topic => `<code>${escapeHTML(topic)}</code>`)
                  .join(" &nbsp; ");

                return `<td width="50%" valign="top">\n` +
                  `  <h3>🚀 <a href="${url}">${name}</a></h3>\n` +
                  `  <p>${description}</p>\n` +
                  `  <p>${language}${stars}</p>\n` +
                  (topics ? `  <p>${topics}</p>\n` : "") +
                  `  <sub>${freshness} Updated ${updatedLabel}</sub><br>\n` +
                  `  <a href="${url}"><strong>Explore repository ↗</strong></a>\n` +
                  `</td>`;
              }

              const cardRows = [];
              for (let i = 0; i < latest.length; i += 2) {
                const left = repositoryCard(latest[i]);
                const right = latest[i + 1]
                  ? repositoryCard(latest[i + 1])
                  : '<td width="50%"></td>';
                cardRows.push(`<tr>\n${left}\n${right}\n</tr>`);
              }

              const repoContent = latest.length
                ? `<table>\n${cardRows.join("\n")}\n</table>`
                : "<sub>No public repositories found yet.</sub>";

              updated = replaceMarkedBlock(
                updated,
                "<!-- REPOSITORIES:START -->",
                "<!-- REPOSITORIES:END -->",
                repoContent,
                "Latest repositories"
              );

              // Optional compact repository summary. Requires matching README markers.
              if (updated.includes("<!-- REPO_SUMMARY:START -->")) {
                const active = repos.filter(repo => daysSince(repo.pushed_at || repo.updated_at) <= 14).length;
                const total = repos.length;
                const summary = total
                  ? `<sub><b>${total}</b> public repositories &nbsp;·&nbsp; <b>${active}</b> active in the last 14 days &nbsp;·&nbsp; Last push ${relativeTime(repos[0].pushed_at || repos[0].updated_at)}</sub>`
                  : "<sub>No public repositories yet.</sub>";

                updated = replaceMarkedBlock(
                  updated,
                  "<!-- REPO_SUMMARY:START -->",
                  "<!-- REPO_SUMMARY:END -->",
                  summary,
                  "Repository summary"
                );
              }
            }

            // 2) Latest commit activity for the three most recently pushed repositories.
            if (reposAvailable) {
              const commitRepos = repos.slice(0, 3);
              const commitRows = [];

              for (const repo of commitRepos) {
                try {
                  const response = await github.rest.repos.listCommits({
                    owner,
                    repo: repo.name,
                    per_page: 1
                  });

                  const commit = response.data[0];
                  if (!commit) continue;

                  const message = escapeHTML(cleanText(tidyCommitMessage(commit.commit.message), 90));
                  const date = commit.commit.author?.date || commit.commit.committer?.date;
                  const when = date ? relativeTime(date) : "date unavailable";
                  const shortSha = commit.sha.slice(0, 7);
                  const repoNameSafe = escapeHTML(repo.name);
                  const repoUrl = escapeHTML(repo.html_url);
                  const commitUrl = escapeHTML(commit.html_url);

                  commitRows.push(
                    `<tr>\n` +
                    `  <td><strong><a href="${repoUrl}">${repoNameSafe}</a></strong></td>\n` +
                    `  <td><a href="${commitUrl}"><code>${shortSha}</code></a></td>\n` +
                    `  <td>${message}</td>\n` +
                    `  <td><sub>${when}</sub></td>\n` +
                    `</tr>`
                  );
                } catch (error) {
                  core.warning(`Could not fetch latest commit for ${repo.name}: ${error.message}`);
                }
              }

              const commitsContent = commitRows.length
                ? `<table>\n<thead><tr><th>Repository</th><th>Commit</th><th>Latest change</th><th>When</th></tr></thead>\n<tbody>\n${commitRows.join("\n")}\n</tbody>\n</table>`
                : "<sub>No recent commits could be retrieved for the selected public repositories.</sub>";

              updated = replaceMarkedBlock(
                updated,
                "<!-- RECENT_COMMITS:START -->",
                "<!-- RECENT_COMMITS:END -->",
                commitsContent,
                "Recent commits"
              );
            }

            // 3) Optional Q1 day counter. Configure repository variable Q1_START_DATE as YYYY-MM-DD.
            const startDateValue = process.env.Q1_START_DATE;
            if (!startDateValue) {
              core.warning("Q1_START_DATE is not set; leaving the roadmap progress block unchanged.");
            } else {
              const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(startDateValue);
              const startDate = match
                ? new Date(Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3])))
                : null;

              if (!startDate || Number.isNaN(startDate.getTime())
                  || startDate.toISOString().slice(0, 10) !== startDateValue) {
                core.warning("Q1_START_DATE must be a valid YYYY-MM-DD date; skipping roadmap progress.");
              } else {
                const today = new Date();
                const todayUtc = Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate());
                const elapsedDays = Math.floor((todayUtc - startDate.getTime()) / 86400000) + 1;

                if (elapsedDays < 1) {
                  core.warning("Q1_START_DATE is in the future; skipping roadmap progress.");
                } else {
                  const day = Math.min(elapsedDays, 90);
                  const suffix = elapsedDays > 90
                    ? " · 90-day Q1 window elapsed"
                    : "";
                  const progress = `<sub>Q1 of 12 · Foundations · Day ${day} of 90${suffix}</sub>`;

                  updated = replaceMarkedBlock(
                    updated,
                    "<!-- ROADMAP_PROGRESS:START -->",
                    "<!-- ROADMAP_PROGRESS:END -->",
                    progress,
                    "Roadmap progress"
                  );
                }
              }
            }

            if (updated === readme) {
              core.info("No README changes were required.");
            } else {
              fs.writeFileSync(path, updated, "utf8");
              core.info("README dynamic sections generated.");
            }
        env:
          Q1_START_DATE: ${{ vars.Q1_START_DATE }}

      - name: Commit and push README updates
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain README.md)" ]]; then
            echo "README is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "chore: refresh dynamic profile data"

          # Rebase the generated commit on the latest default-branch state.
          git fetch origin "$BRANCH_NAME"
          git pull --rebase origin "$BRANCH_NAME"
          git push origin "HEAD:$BRANCH_NAME"
