
name: Update latest repositories

on:
  schedule:
    - cron: "23 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout profile repository
      - name: Checkout profile repository
        uses: actions/checkout@v6

      # Step 2: Generate responsive repository cards
      - name: Update README repository cards
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");

            const path = "README.md";
            const start = "<!-- REPOSITORIES:START -->";
            const end = "<!-- REPOSITORIES:END -->";

            // Read README
            const readme = fs.readFileSync(path, "utf8");

            // Find repository markers
            const startIndex = readme.indexOf(start);
            const endIndex = readme.indexOf(end);

            // Validate markers
            if (
              startIndex === -1 ||
              endIndex === -1 ||
              endIndex < startIndex
            ) {
              core.setFailed(
                "Repository markers are missing or incorrectly ordered in README.md."
              );
              return;
            }

            // Escape HTML
            function escapeHtml(value) {
              return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
            }

            // Fetch public repositories
            const owner = context.repo.owner;

            const { data: repos } =
              await github.rest.repos.listForUser({
                username: owner,
                type: "owner",
                sort: "updated",
                direction: "desc",
                per_page: 100
              });

            // Select latest five eligible repositories
            const visible = repos
              .filter(repo =>
                !repo.fork &&
                !repo.archived &&
                !repo.private
              )
              .sort(
                (a, b) =>
                  new Date(b.updated_at) -
                  new Date(a.updated_at)
              )
              .slice(0, 5);

            // Generate full-width repository cards
            const cards = visible.map(repo => {
              const name = escapeHtml(repo.name);

              const description = escapeHtml(
                repo.description ||
                "Explore this repository and its development."
              );

              const language = escapeHtml(
                repo.language || "Not specified"
              );

              const languageBadge = encodeURIComponent(
                repo.language || "Not specified"
              );

              const stars = repo.stargazers_count;

              const updated = new Date(repo.updated_at)
                .toISOString()
                .slice(0, 10);

              const url = escapeHtml(repo.html_url);

              return `<tr><td width="100%"><div align="left"><h3><a href="${url}">📁 ${name}</a></h3><p>${description}</p><p><img src="https://img.shields.io/badge/Language-${languageBadge}-2563EB?style=flat-square" alt="Language: ${language}"> <img src="https://img.shields.io/badge/Stars-${stars}-F59E0B?style=flat-square&logo=github&logoColor=white" alt="Stars: ${stars}"></p><p><sub>🕒 Last updated: ${updated}</sub></p><p><a href="${url}">View Repository ↗</a></p></div></td></tr>`;
            });

            // Build full-width vertical layout
            const section = visible.length
              ? `<table><tbody>${cards.join("")}</tbody></table>`
              : '<p align="center"><i>No public repositories found yet.</i></p>';

            // Replace content between markers
            const contentStart = startIndex + start.length;
            const contentEnd = endIndex;

            const updatedReadme =
              readme.slice(0, contentStart) +
              "\n" +
              section +
              "\n" +
              readme.slice(contentEnd);

            // Skip if no changes
            if (updatedReadme === readme) {
              core.info(
                "Repository cards are already up to date. No changes required."
              );
              return;
            }

            // Write updated README
            fs.writeFileSync(path, updatedReadme, "utf8");

            core.info(
              `Successfully generated ${visible.length} full-width repository cards.`
            );

      # Step 3: Commit and push changes
      - name: Commit updated README
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add README.md

            git commit -m "chore: improve latest repository layout"

            git push
          else
            echo "README is already up to date. No commit required."
          fi
