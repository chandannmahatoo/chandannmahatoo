
name: Update latest repositories

on:
  schedule:
    - cron: "23 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Update README repository list
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const path = "README.md";
            const start = "<!-- REPOSITORIES:START -->";
            const end = "<!-- REPOSITORIES:END -->";

            const readme = fs.readFileSync(path, "utf8");
            const owner = context.repo.owner;

            const { data: repos } = await github.rest.repos.listForUser({
              username: owner,
              type: "owner",
              sort: "updated",
              direction: "desc",
              per_page: 100
            });

            const visible = repos
              .filter(repo => !repo.fork && !repo.archived && !repo.private)
              .slice(0, 8);

            const section = visible.length
              ? visible.map(repo => {
                  const description = repo.description
                    ? repo.description.replace(/\r?\n/g, " ").replace(/\|/g, "\\|")
                    : "No description provided yet.";

                  const language = repo.language || "Not specified";

                  return `- **[${repo.name}](${repo.html_url})** — ${description}  \n  \`${language}\` · ⭐ ${repo.stargazers_count} · Updated: ${repo.updated_at.slice(0, 10)}`;
                }).join("\n")
              : "_No public repositories found yet._";

            const updated = readme.replace(
              new RegExp(`${start}[\\s\\S]*?${end}`),
              `${start}\n${section}\n${end}`
            );

            if (updated === readme) {
              core.setFailed("README markers were not found or no content changed.");
              return;
            }

            fs.writeFileSync(path, updated);

      - name: Commit updated README
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update latest repositories"
            git push
          else
            echo "README is already up to date."
          fi
