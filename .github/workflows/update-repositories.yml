
name: Update latest repositories

on:
  schedule:
    - cron: "23 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the profile repository
      - name: Checkout profile repository
        uses: actions/checkout@v6

      # Step 2: Fetch repositories and update README
      - name: Update README repository cards
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");

            const path = "README.md";
            const start = "<!-- REPOSITORIES:START -->";
            const end = "<!-- REPOSITORIES:END -->";

            // Read README
            const readme = fs.readFileSync(path, "utf8");

            // Find README markers
            const startIndex = readme.indexOf(start);
            const endIndex = readme.indexOf(end);

            // Validate markers
            if (
              startIndex === -1 ||
              endIndex === -1 ||
              endIndex < startIndex
            ) {
              core.setFailed(
                "Repository markers are missing or incorrectly ordered in README.md."
              );
              return;
            }

            // Escape HTML to safely display repository metadata
            function escapeHtml(value) {
              return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
            }

            // Get GitHub username
            const owner = context.repo.owner;

            // Fetch public repositories
            const { data: repos } =
              await github.rest.repos.listForUser({
                username: owner,
                type: "owner",
                sort: "updated",
                direction: "desc",
                per_page: 100
              });

            // Filter repositories and select the latest five
            const visible = repos
              .filter(repo =>
                !repo.fork &&
                !repo.archived &&
                !repo.private
              )
              .sort(
                (a, b) =>
                  new Date(b.updated_at) - new Date(a.updated_at)
              )
              .slice(0, 5);

            // Generate repository cards
            const cards = visible.map(repo => {
              const name = escapeHtml(repo.name);

              const description = escapeHtml(
                repo.description ||
                "Explore this repository and its development."
              );

              const language = escapeHtml(
                repo.language || "Not specified"
              );

              const languageBadge = encodeURIComponent(
                repo.language || "Not specified"
              );

              const stars = repo.stargazers_count;

              const updated = new Date(repo.updated_at)
                .toISOString()
                .slice(0, 10);

              const url = escapeHtml(repo.html_url);

              return `
              <td width="50%" valign="top">
                <div align="center">

                  <h3>
                    <a href="${url}">${name}</a>
                  </h3>

                  <p>${description}</p>

                  <p>
                    <img
                      src="https://img.shields.io/badge/Language-${languageBadge}-2563EB?style=flat-square"
                      alt="Language: ${language}"
                    />
                    <img
                      src="https://img.shields.io/badge/Stars-${stars}-F59E0B?style=flat-square&logo=github&logoColor=white"
                      alt="Stars: ${stars}"
                    />
                  </p>

                  <p>
                    <sub>Last updated: ${updated}</sub>
                  </p>

                  <p>
                    <a href="${url}">View Repository ↗</a>
                  </p>

                </div>
              </td>
              `;
            });

            // Arrange cards in two-column rows
            const rows = [];

            for (let i = 0; i < cards.length; i += 2) {
              const first = cards[i];
              const second = cards[i + 1] || '<td width="50%"></td>';

              rows.push(`
              <tr>
                ${first}
                ${second}
              </tr>
              `);
            }

            // Build the final HTML section
            const section = visible.length
              ? `
            <table>
              <tbody>
                ${rows.join("\n")}
              </tbody>
            </table>
            `
              : `
            <p align="center">
              <i>No public repositories found yet.</i>
            </p>
            `;

            // Replace content between markers
            const contentStart = startIndex + start.length;
            const contentEnd = endIndex;

            const updated =
              readme.slice(0, contentStart) +
              "\n" +
              section +
              "\n" +
              readme.slice(contentEnd);

            // Skip writing if nothing changed
            if (updated === readme) {
              core.info(
                "Repository cards are already up to date. No changes required."
              );
              return;
            }

            // Save updated README
            fs.writeFileSync(path, updated, "utf8");

            core.info(
              `Successfully updated README with ${visible.length} repository cards.`
            );

      # Step 3: Commit and push changes
      - name: Commit updated README
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add README.md

            git commit -m "chore: update latest repository cards"

            git push
          else
            echo "README is already up to date. No commit required."
          fi
