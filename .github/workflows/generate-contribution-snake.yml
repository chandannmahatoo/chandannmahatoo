name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared with the profile-data workflow to serialize writes to this repository.
concurrency:
  group: profile-readme-writes-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: chandannmahatoo
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish SVGs to output branch
        env:
          BRANCH_NAME: output
        run: |
          set -euo pipefail

          # Preserve generated assets outside the checked-out branch.
          mkdir -p "$RUNNER_TEMP/snake-assets"
          cp -R dist/. "$RUNNER_TEMP/snake-assets/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Determine whether the output branch already exists.
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            git fetch origin "$BRANCH_NAME"
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
            branch_exists=true
          else
            git checkout --orphan "$BRANCH_NAME"
            git rm -rf . >/dev/null 2>&1 || true
            branch_exists=false
          fi

          # Keep only the generated snake assets on the output branch.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/snake-assets/." .

          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg

          if git diff --cached --quiet; then
            echo "Snake SVGs are already up to date."
            exit 0
          fi

          git commit -m "chore: update contribution snake"

          # Existing branch: rebase before pushing. First publish has no remote branch to rebase onto.
          if [[ "$branch_exists" == "true" ]]; then
            git pull --rebase origin "$BRANCH_NAME"
          fi

          git push origin "HEAD:$BRANCH_NAME"
