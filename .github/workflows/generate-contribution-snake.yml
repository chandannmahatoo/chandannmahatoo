name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared with the profile-data workflow to serialize writes to this repository.
concurrency:
  group: profile-readme-writes-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: chandannmahatoo
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      
      - name: Publish SVGs to output branch
        env:
          BRANCH_NAME: output
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Create a clean directory for publishing.
          mkdir -p "$RUNNER_TEMP/snake-publish"
          cp dist/github-contribution-grid-snake.svg \
            "$RUNNER_TEMP/snake-publish/"
          cp dist/github-contribution-grid-snake-dark.svg \
            "$RUNNER_TEMP/snake-publish/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fetch the output branch if it already exists.
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            git fetch origin "$BRANCH_NAME"
            git worktree add \
              -B "$BRANCH_NAME" \
              "$RUNNER_TEMP/snake-output" \
              "origin/$BRANCH_NAME"
            branch_exists=true
          else
            git worktree add --detach "$RUNNER_TEMP/snake-output" HEAD
            cd "$RUNNER_TEMP/snake-output"
            git switch --orphan "$BRANCH_NAME"
            git rm -rf . >/dev/null 2>&1 || true
            branch_exists=false
          fi

          cd "$RUNNER_TEMP/snake-output"

          # Replace only the generated files in the isolated worktree.
          cp "$RUNNER_TEMP/snake-publish/"*.svg .

          git add github-contribution-grid-snake.svg \
                  github-contribution-grid-snake-dark.svg

          if git diff --cached --quiet; then
            echo "Snake SVGs are already up to date."
            exit 0
          fi

          git commit -m "chore: update contribution snake"

          # Rebase against the latest output branch before publishing.
          if [[ "$branch_exists" == "true" ]]; then
            git fetch origin "$BRANCH_NAME"
            git pull --rebase origin "$BRANCH_NAME"
          fi

          git push origin "HEAD:$BRANCH_NAME"
